<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | JEE Smart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="contact-body">

    <nav>

        <div class="logo">
            JEE Smart
        </div>

        <ul>

            <li><a href="about.html">About</a></li>

            <li><a href="mocktests.html">Mock Tests</a></li>

            <li><a href="collegepredictor.html">College Predictor</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

        <button onclick="location.href='login.html'">
            Login
        </button>

    </nav>

    <section class="login-page">

        <div class="login-box">

            <h1>Create Your Account</h1>

            <p class="subtitle">

                Join JEE Smart and start your learning journey.

            </p>

            <form id="signupForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                >

                <small id="nameError" class="error"></small>

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <small id="emailError" class="error"></small>

                <label>Phone Number</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter your phone number"
                >

                <small id="phoneError" class="error"></small>

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                >

                <small id="passwordError" class="error"></small>

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                >

                <small id="confirmError" class="error"></small>

                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <small id="termsError" class="error"></small>

                <button
                    type="submit"
                    class="login-btn"
                >

                    Create Account

                </button>

            </form>

            <p class="signup-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </section>

    <script src="js/signup.js"></script>

    <script src="js/script.js"></script>`r`n</body>

</html>
