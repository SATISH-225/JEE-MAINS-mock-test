<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock Test | JEE Smart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="test-page">

    <div class="test-container">

        <!-- Left Side -->

        <div class="question-panel">

            <h2 id="subjectName">Physics Mock Test</h2>

            <div class="timer">

                ⏰ Time Left :
                <span id="time">20:00</span>

            </div>

            <hr>

            <h3>

                Question
                <span id="questionNumber">1</span>
                of 15

            </h3>

            <p id="question"></p>

            <div class="options">

                <label>
                    <input type="radio" name="option" value="0">
                    <span id="option0"></span>
                </label>

                <br><br>

                <label>
                    <input type="radio" name="option" value="1">
                    <span id="option1"></span>
                </label>

                <br><br>

                <label>
                    <input type="radio" name="option" value="2">
                    <span id="option2"></span>
                </label>

                <br><br>

                <label>
                    <input type="radio" name="option" value="3">
                    <span id="option3"></span>
                </label>

            </div>

            <br>

            <div class="buttons">

                <button id="prevBtn">Previous</button>

                <button id="nextBtn">Next</button>

                <button id="submitBtn">Submit Test</button>

            </div>

        </div>

        <!-- Right Side -->

        <div class="palette">

            <h3>Question Palette</h3>

            <div id="questionPalette"></div>

        </div>

    </div>

</section>
<script src="js/physicsQuestions.js"></script>
<script src="js/chemistryQuestions.js"></script>
<script src="js/mathematicsQuestions.js"></script>

<script src="js/test.js"></script>

    <script src="js/script.js"></script>`r`n</body>

</html>
